<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
        <link href="miniradio_style.css" rel="stylesheet" type="text/css" />
    </head>
    <body>
        <div id="hudDiv" style="display:none;">
            <div id="hudFrame" class="bg-v2-background">
                <div id="hudHeader">
                    <div id="hudHeaderTitleGroup">
                        <div id="hudHeaderTitle">Sonoran Radio</div>
                        <div id="hudHeaderSubtitle">Connected Users</div>
                    </div>
                    <div id="hudHeaderControls">
                        <button type="button" class="control" onclick="requestEscape();">&times;</button>
                    </div>
                </div>
                <div id="hudToolbar" class="bg-v2-background-light">
                    <div id="hudHeaderStats">
                        <div class="headerStat">
                            <span class="headerStatLabel">Channels</span>
                            <strong id="hudChannelCount">0</strong>
                        </div>
                        <div class="headerStat">
                            <span class="headerStatLabel">Users</span>
                            <strong id="hudUserCount">0</strong>
                        </div>
                    </div>
                </div>
                <div id="hudContentWrapper"></div>
            </div>
        </div>

        <script src="miniradio_script.js" type="text/javascript"></script>
    </body>
</html>
