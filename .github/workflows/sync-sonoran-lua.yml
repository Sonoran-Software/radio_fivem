name: Sync Sonoran.lua

on:
  repository_dispatch:
    types:
      - sonoran-lua-updated
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-sonoran-lua-enhanced
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout radio_fivem enhanced
        uses: actions/checkout@v4
        with:
          ref: enhanced
          fetch-depth: 0

      - name: Checkout Sonoran.lua
        uses: actions/checkout@v4
        with:
          repository: Sonoran-Software/Sonoran.Lua
          ref: master
          path: _sonoran_lua

      - name: Sync vendored Sonoran.lua files
        run: |
          rm -rf lua/sonoran
          mkdir -p lua
          cp -R _sonoran_lua/lua/sonoran lua/sonoran

      - name: Commit synced files
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- lua/sonoran)" ]; then
            echo "No Sonoran.lua changes to sync."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lua/sonoran
          git commit -m "chore: sync Sonoran.lua"
          git push origin HEAD:enhanced
          echo "synced=true" >> "$GITHUB_OUTPUT"

      - name: Trigger production release
        if: steps.commit.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run resource-release-prod-auto-patch.yml --ref enhanced
