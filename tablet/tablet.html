<!DOCTYPE html>
<html>

<head>
  <style>
    #tablet {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translate(-50%, 0);
      border: 20px solid #1a1a1a;
      border-top-width: 35px;
      border-bottom-width: 35px;
      border-radius: 35px;
      background: #2c2c2c;
      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.2),
        0 2px 8px rgba(0, 0, 0, 0.1);
      transition: opacity 0.15s ease;
    }

    #tablet>#homeButton {
      position: absolute;
      bottom: -25px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 14px;
      border: 1px solid #404040;
      border-radius: 7px;
      background: #2c2c2c;
      box-shadow:
        0 0 2px rgba(0, 0, 0, 0.5),
        inset 0 0 2px rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #tablet>#homeButton:hover {
      background: #e74c3c;
      border-color: #e74c3c;
    }

    #tablet>#tabletCamera {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: #404040;
      border-radius: 50%;
      border: 1px solid #2c2c2c;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.3),
        inset 0 0 2px 1px rgba(0, 0, 0, 0.5);
    }

    #tablet>#tabletCamera::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #1a1a1a;
      box-shadow: inset 0 0 1px 1px rgba(0, 0, 0, 0.8);
    }

    #tablet>#radioFrame {
      margin: 0;
      padding: 0;
      border: none;
      display: block;
      overflow: hidden;
      pointer-events: auto;
    }
  </style>
</head>

<body style="pointer-events:none">
  <div id="tablet" style="display:none">
    <div id="homeButton"></div>
    <div id="tabletCamera"></div>
    <!-- Edit the src field below with your custom link, if used. You can also resize the tablet frame. -->
    <iframe id="radioFrame" src="https://sonoranradio.com/" width="1280" height="640"></iframe>
  </div>

  <script>
    const tabletEl = document.getElementById('tablet');
    const homeButtonEl = document.getElementById('homeButton');
    let isTabletVisible = false;

    function setDisplay(enable) {
      const shouldShow = typeof enable === "boolean" ? enable : !isTabletVisible;
      isTabletVisible = shouldShow;
      tabletEl.style.display = shouldShow ? '' : 'none';
      document.body.style.pointerEvents = shouldShow ? '' : 'none';
    }

    function postTabletClose(reason) {
      if (!isTabletVisible) return;
      fetch('https://sonoranradio/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify({ type: 'escape' })
      });
    }

    window.addEventListener('message', (ev) => {
      if (ev.data && ev.data.type === 'setDisplay') setDisplay(ev.data.enable);
    });

    window.addEventListener('keyup', (ev) => {
      parent.postMessage({ type: 'keyup', key: ev.which, code: ev.code }, '*');
    });
    homeButtonEl.addEventListener('click', () => parent.postMessage({ type: 'keyup', code: 'Escape' }));
  </script>
</body>

</html>
