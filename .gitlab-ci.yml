resource-build:
  stage: build
  script:
    # copy a clean node_modules for the build
    - yarn --prod
    - cp -r node_modules build/sonoranradio
    # build the program and copy all files over
    - yarn
    - NODE_ENV=production yarn build
    - cp -r sonrad_tower/stream sonrad_tower/data build/sonoranradio
    - cp -r lua dist skins towers.json build/sonoranradio
    # set the version of version.json and fxmanifest.lua
    - >-
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        export RESOURCE_VERSION="$CI_COMMIT_TAG"
      else
        export RESOURCE_VERSION="$CI_COMMIT_REF_NAME@$CI_PIPELINE_IID"
      fi
    - envsubst < version.json > build/version.json
    - envsubst < fxmanifest.prod.lua > build/sonoranradio/fxmanifest.lua
  artifacts:
    paths:
      - build
    expire_in: 1 month
  only:
    - branches
    - tags
  tags:
    - linux, build, shell, development

resource-deploy-QAServer:
  stage: deploy
  script:
    - cd build
    - zip -r sonoranradio sonoranradio
    - lftp -e "open sftp://GME01.SonoranServers.com:2022; user $FiveM01_Ptero_User $FiveM01_Ptero_Pass; rmdir /resources/[sonoranradio]; mkdir -p /resources/[sonoranradio]; cd /resources/[sonoranradio]; put sonoranradio.zip; bye"
    - >-
        curl "https://game.sonoranservers.com/api/client/servers/$FiveM01_ID/files/decompress"
        -H "Content-Type: application/json"
        -H "Authorization: Bearer $Ptero_API_Key"
        -X POST
        -d '{"root": "/resources/[sonoranradio]/","file": "sonoranradio.zip"}'
    - >-
        curl "https://game.sonoranservers.com/api/client/servers/$FiveM01_ID/files/delete"
        -H "Content-Type: application/json"
        -H "Authorization: Bearer $Ptero_API_Key"
        -X POST
        -d '{"root": "/resources/[sonoranradio]/","files": ["sonoranradio.zip"]}'
    - cd ../
    - lftp -e "open sftp://GME01.SonoranServers.com:2022; user $FiveM01_Ptero_User $FiveM01_Ptero_Pass; cd /resources/[sonoranradio]/sonoranradio; put QA-config.lua -o config.lua; cd ../; rmdir sonoranradio_updatehelper; bye"

  tags:
    - linux, build, shell, development
  only:
    - master
    - development
    - standalone
    - standalone_dev

resource-deploy-prod:
  stage: deploy
  script:
    # create zip of resources
    - cd build
    - zip -r latest sonoranradio
    - zip -r latest sonoranradio_updatehelper
    - cd ..
    # send files over to the webserver
    - |
      if [[ "$CI_COMMIT_TAG" =~ ^1\. ]]; then
        rsync build/latest.zip git@$PROD01_IP:/home/services/frontend/www/download.sonoransoftware.com/sonoranradio/archive/latest.zip
        rsync build/version.json git@$PROD01_IP:/home/services/frontend/www/download.sonoransoftware.com/sonoranradio/version.json
      else
        rsync build/latest.zip git@$PROD01_IP:/home/services/frontend/www/download.sonoransoftware.com/sonoranradio/fivem/latest.zip
        rsync build/version.json git@$PROD01_IP:/home/services/frontend/www/download.sonoransoftware.com/sonoranradio/fivem/version.json
      fi
    # clear cloudflare cache
    - >-
      curl -X POST "https://api.cloudflare.com/client/v4/zones/5e892b9b03facaf059df71c6154a823b/purge_cache"
      -H "Authorization: Bearer $CF_Cache_Key"
      -H "Content-Type: application/json"
      --data '{"files":["https://download.sonoransoftware.com/sonoranradio/archive/latest.zip","https://download.sonoransoftware.com/sonoranradio/version.json"]}'
  tags:
    - linux, build, shell, development
  dependencies:
    - resource-build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
      when: always
